# ============================================================
# 数创星光外卖 - Spring Boot 主配置
# 本地开发：从项目根目录或 solo-eats-app 目录运行均可读取 .env
# 生产环境：所有密码、JWT 密钥必须由环境变量或配置中心注入
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 8192

spring:
  application:
    name: solo-eats
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:solo_eats}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${MYSQL_USER:solo}
    password: ${MYSQL_PASSWORD:change_me_mysql}
    hikari:
      pool-name: SoloEatsHikari
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me_redis}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:solo}
    password: ${RABBITMQ_PASSWORD:change_me_rabbitmq}
    virtual-host: "${RABBITMQ_VHOST:/}"
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    # 只对空库启用 Flyway；已有库保持 FLYWAY_ENABLED=false。
    # 禁止 baseline：半成品库会被误标记为已执行 V1，导致缺表静默上线。
    baseline-on-migrate: false
    validate-on-migrate: true
    table: flyway_schema_history

  # SMTP 全部走环境变量；默认值为空，禁止把真实账号密码写进配置文件
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.soloeats
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  # 管理端口不对外发布，避免 metrics/health 细节暴露在业务端口
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true

logging:
  level:
    root: INFO
    # 默认 INFO；本地联调可在 .env 设 LOG_LEVEL_SOLOEATS=DEBUG。生产保持 INFO，避免 SQL 参数与收货信息落日志
    com.soloeats: ${LOG_LEVEL_SOLOEATS:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{40} - %msg%n"

app:
  auth:
    # 旧契约 role → principal 模拟登录开关；生产必须关闭
    mock-login-enabled: ${AUTH_MOCK_LOGIN_ENABLED:true}
    # T06 短信通道落地前的入驻验证码开关：true 时只接受 000000
    mock-sms-enabled: ${AUTH_MOCK_SMS_ENABLED:true}
  security:
    # C 端手机号 AES-GCM 密钥与 SHA-256 加盐：默认值仅供 local/dev 本地开发，
    # 生产必须由环境变量 PHONE_AES_KEY / PHONE_HASH_SALT 注入（见 .env.example）
    phone-aes-key: ${PHONE_AES_KEY:change_me_phone_aes_key_32bytes}
    phone-hash-salt: ${PHONE_HASH_SALT:change_me_phone_hash_salt}
  tenant:
    # 多租户隔离总开关（TenantLineInnerInterceptor 已注册，关闭时由运维置 false 并重启）
    enabled: ${TENANT_ENABLED:true}
  crypto:
    # SMTP 密码 AES-GCM 密钥；未配置时拒绝写入/读取邮件密码
    mail-key: ${MAIL_KEY:}
    # 商家 PII（法人身份证、银行卡号）AES-GCM 密钥；未配置时拒绝加解密
    pii-key: ${PII_KEY:}
  rate-limit:
    order-create:
      limit: ${RATE_LIMIT_ORDER_CREATE:20}
      window-seconds: 60
    payment-pay:
      limit: ${RATE_LIMIT_PAYMENT_PAY:20}
      window-seconds: 60
    auth-login:
      limit: ${RATE_LIMIT_AUTH_LOGIN:10}
      window-seconds: 60
  jwt:
    secret: ${JWT_SECRET:change_me_change_me_change_me_32bytes}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  order:
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:15}
    timeout-delay-seconds: ${ORDER_TIMEOUT_DELAY_SECONDS:900}
    merchant-accept-timeout-minutes: ${ORDER_ACCEPT_TIMEOUT_MINUTES:10}
    after-sales-days: ${ORDER_AFTER_SALES_DAYS:7}
    auto-complete-hours: ${ORDER_AUTO_COMPLETE_HOURS:24}
  product:
    # 门店改价审核开关；P0 默认免审，上架/改价后 audit_status 直接写 2
    price-audit-enabled: ${PRODUCT_PRICE_AUDIT_ENABLED:false}
    # 商品图允许的外部域名前缀（逗号分隔）；t_file 代理地址 /api/v1/files/ 始终允许
    image-host-allowlist: ${PRODUCT_IMAGE_HOST_ALLOWLIST:}
    # 用户端菜单缓存 TTL（秒）
    menu-cache-seconds: ${PRODUCT_MENU_CACHE_SECONDS:300}
  payment:
    callback-secret: ${PAYMENT_CALLBACK_SECRET:change_me_payment_callback_secret}
  pickup:
    timeout-minutes: ${PICKUP_TIMEOUT_MINUTES:120}
  dispatch:
    expire-seconds: ${DISPATCH_EXPIRE_SECONDS:15}
    max-retry: ${DISPATCH_MAX_RETRY:3}
    # 承诺送达时间估算速度（米/分钟），接单时 promise_deliver_at = now + 出餐 + ceil(distance/avg)
    avg-speed-m-per-min: ${DISPATCH_AVG_SPEED_M_PER_MIN:250}
  settlement:
    bill-cron: "${SETTLEMENT_BILL_CRON:0 0 2 * * ?}"
    default-commission-rate: ${DEFAULT_COMMISSION_RATE:0.0600}
  wallet:
    # C 端模拟充值开关；仅 local/dev 允许为 true，生产必须设 WALLET_MOCK_RECHARGE_ENABLED=false
    mock-recharge-enabled: ${WALLET_MOCK_RECHARGE_ENABLED:true}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  im:
    # 订单完成后会话保留天数，超过后转 status=2 只读；阶段B 只下发配置，扫描任务尚未接入
    readonly-after-days: 7
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:change_me_minio}
    secret-key: ${MINIO_ROOT_PASSWORD:change_me_minio_secret}
    bucket: ${MINIO_BUCKET:solo-eats}
    secure: ${MINIO_SECURE:false}
