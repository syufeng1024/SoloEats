# 集成测试专用。数据源由 Testcontainers 通过 DynamicPropertySource 注入。
spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis

app:
  payment:
    callback-secret: test-callback-secret
  jwt:
    secret: test_jwt_secret_key_32bytes_min_123456
  order:
    timeout-delay-seconds: 1

logging:
  level:
    root: WARN
    com.soloeats: INFO
