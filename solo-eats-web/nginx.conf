server {
    listen 80;
    server_name _;

    # app 容器重建后 IP 会变化，运行时按 Docker DNS 重新解析，避免 nginx 缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;

    root /usr/share/nginx/html;
    index index.html;

    # 与 Spring 的 multipart max-request-size=20MB 对齐
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端没有配置 CORS，浏览器只访问同源 /api，由 nginx 转发到 app 容器
    location /api/ {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite 产物带内容哈希，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # createWebHistory 路由需要回退到 index.html
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
