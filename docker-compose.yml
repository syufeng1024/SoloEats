name: solo-eats

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: ${REGISTRY_PREFIX:-}library/mysql:8.0
    container_name: solo-eats-mysql
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solo_eats}
      MYSQL_USER: ${MYSQL_USER:-solo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=1
      - --sql-mode=STRICT_TRANS_TABLES,ONLY_FULL_GROUP_BY,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - solo-eats-net

  redis:
    image: ${REGISTRY_PREFIX:-}library/redis:7.2-alpine
    container_name: solo-eats-redis
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - solo-eats-net

  rabbitmq:
    image: ${REGISTRY_PREFIX:-}library/rabbitmq:3.12-management-alpine
    container_name: solo-eats-rabbitmq
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-solo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - solo-eats-net

  minio:
    image: ${SILO_IMAGE:-docker.m.daocloud.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    container_name: solo-eats-minio
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - solo-eats-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-17}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:17-jre-alpine}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: ${APP_IMAGE:-solo-eats-app:latest}
    container_name: solo-eats-app
    restart: unless-stopped
    # graceful shutdown 默认 30s，必须大于 Docker 默认 10s 的 SIGKILL 宽限期
    stop_grace_period: 40s
    mem_limit: 1g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      # 容器内必须走服务名与容器端口，不能复用 .env 里的宿主机映射端口 3307
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solo_eats}
      MYSQL_USER: ${MYSQL_USER:-solo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-solo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-solo-eats}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?set PAYMENT_CALLBACK_SECRET in .env}
      # 默认关闭，避免对已有库误执行迁移；全新数据卷请在 .env 显式设为 true
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      LOG_LEVEL_SOLOEATS: ${LOG_LEVEL_SOLOEATS:-INFO}
      ORDER_TIMEOUT_DELAY_SECONDS: ${ORDER_TIMEOUT_DELAY_SECONDS:-900}
      RATE_LIMIT_ORDER_CREATE: ${RATE_LIMIT_ORDER_CREATE:-20}
      RATE_LIMIT_PAYMENT_PAY: ${RATE_LIMIT_PAYMENT_PAY:-20}
      RATE_LIMIT_AUTH_LOGIN: ${RATE_LIMIT_AUTH_LOGIN:-10}
      # ---- T05~T16 新增模块：必须透传，否则容器内一律回落 application.yml 默认值 ----
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      # 登录模式与多租户；生产必须关闭 mock 登录
      AUTH_MOCK_LOGIN_ENABLED: ${AUTH_MOCK_LOGIN_ENABLED:-true}
      AUTH_MOCK_SMS_ENABLED: ${AUTH_MOCK_SMS_ENABLED:-true}
      TENANT_ENABLED: ${TENANT_ENABLED:-true}
      # OpenAPI 文档（/swagger-ui.html、/v3/api-docs）：本地默认开启方便调试，
      # 生产必须设 API_DOC_ENABLED=false，否则 prod profile 下启动校验会直接失败
      API_DOC_ENABLED: ${API_DOC_ENABLED:-true}
      # 密钥类：生产由密钥管理注入，禁止提交真实值
      # PII_KEY 为空会导致商家入驻写法人身份证/银行卡直接报错
      PII_KEY: ${PII_KEY:-}
      PHONE_AES_KEY: ${PHONE_AES_KEY:-change_me_phone_aes_key_32bytes}
      PHONE_HASH_SALT: ${PHONE_HASH_SALT:-change_me_phone_hash_salt}
      MAIL_KEY: ${MAIL_KEY:-}
      # Mail（SMTP）：全部为空时邮件功能不可用，不影响其他模块启动
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-true}
      MAIL_SMTP_CONNECTION_TIMEOUT: ${MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      MAIL_SMTP_TIMEOUT: ${MAIL_SMTP_TIMEOUT:-5000}
      MAIL_SMTP_WRITE_TIMEOUT: ${MAIL_SMTP_WRITE_TIMEOUT:-5000}
      # T05 商品中心
      PRODUCT_PRICE_AUDIT_ENABLED: ${PRODUCT_PRICE_AUDIT_ENABLED:-false}
      PRODUCT_IMAGE_HOST_ALLOWLIST: ${PRODUCT_IMAGE_HOST_ALLOWLIST:-}
      PRODUCT_MENU_CACHE_SECONDS: ${PRODUCT_MENU_CACHE_SECONDS:-300}
      # T06 钱包：模拟充值仅 local/dev 允许
      WALLET_MOCK_RECHARGE_ENABLED: ${WALLET_MOCK_RECHARGE_ENABLED:-true}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      # 订单时限
      ORDER_PAY_TIMEOUT_MINUTES: ${ORDER_PAY_TIMEOUT_MINUTES:-15}
      ORDER_ACCEPT_TIMEOUT_MINUTES: ${ORDER_ACCEPT_TIMEOUT_MINUTES:-10}
      ORDER_AFTER_SALES_DAYS: ${ORDER_AFTER_SALES_DAYS:-7}
      ORDER_AUTO_COMPLETE_HOURS: ${ORDER_AUTO_COMPLETE_HOURS:-24}
      PICKUP_TIMEOUT_MINUTES: ${PICKUP_TIMEOUT_MINUTES:-120}
      # T07 配送
      DISPATCH_EXPIRE_SECONDS: ${DISPATCH_EXPIRE_SECONDS:-15}
      DISPATCH_MAX_RETRY: ${DISPATCH_MAX_RETRY:-3}
      DISPATCH_AVG_SPEED_M_PER_MIN: ${DISPATCH_AVG_SPEED_M_PER_MIN:-250}
      # T16 结算
      SETTLEMENT_BILL_CRON: "${SETTLEMENT_BILL_CRON:-0 0 2 * * ?}"
      DEFAULT_COMMISSION_RATE: ${DEFAULT_COMMISSION_RATE:-0.0600}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      JAVA_OPTS: ${APP_JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseG1GC -Duser.timezone=Asia/Shanghai}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 50s
    networks:
      - solo-eats-net

  web:
    build:
      context: .
      dockerfile: solo-eats-web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: ${WEB_IMAGE:-solo-eats-web:latest}
    container_name: solo-eats-web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solo-eats-net

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  solo-eats-net:
    driver: bridge
